# Adopt Vitest + Playwright test stack with real-DB E2E

## Context
The project had zero automated tests despite containing ~500 lines of pure game-logic TypeScript (\`src/lib/game/\`) and a REST API + UI flow worth protecting. The turn built the full test layer in one pass.

## Choice
- **Unit tests: Vitest** (\`npm run test:unit\`) covering \`scoring.ts\`, \`match-engine.ts\`, \`checkout-suggestions.ts\`, \`stats-engine.ts\`, plus a \`full-match.test.ts\` simulation mirroring \`docs/gameplay-e2e.md\`.
- **E2E tests: Playwright** (\`npm run test:e2e\`) booting the dev server against the **real PostgreSQL DB** (no mock backend).
- **E2E isolation strategy**: every test creates data under unique \`e2e-*@test.local\` email accounts and archives test players afterward; Playwright runs with \`workers: 1\` (sequential) since all tests share the one DB.
- **Skip component-level Svelte tests** (jsdom / svelte-testing-library). Game logic is covered by unit tests; UI behavior is covered by browser E2E. Add component tests only when a component has complex isolated behavior worth testing.

## Alternatives considered
- **Jest** — Vitest is native to the Vite/SvelteKit toolchain and needs only a \`$lib\` alias config.
- **Component tests (svelte-testing-library)** — rejected: extra dependency + setup for coverage the unit/E2E layers already provide.
- **Mocked API for E2E** — rejected: the real value is verifying DB constraints, persistence, and the dev-server wiring; unique account scoping gives isolation without mocks.

## Consequences
- Config lives in \`vitest.config.ts\` (\`$lib\` alias) and \`playwright.config.ts\` (webServer on port 5174, sequential workers).
- E2E requires a reachable DB (dev environment) — CI would need a Postgres service.
- E2E suite is slow-ish by design (14 tests, real server + real DB) — acceptable, kept small.

  "decisions/bull-altar-resurrection-replaces-siege-lock.md": `---
type: Decision
title: Bull Altar resurrection replaces insurgents; Siege map B locked
description: Context
tags: [game-design, risk-darts, conquest-mode, death-mechanic, combat]
status: accepted
timestamp: "2026-09-07T21:07:51.021Z"
---

# Bull Altar resurrection replaces insurgents; Siege map B locked

## Context

Risk Darts brainstorm (see [[risk-darts-proposed-game-mode]]). Until now the standing baseline said: no elimination — a player who lost all land became an **insurgent** (keep throwing, any neutral wedge hit becomes the new homeland), and the combat model was still open (Question 4: glass / siege / fortress, with an assistant lean toward Siege B). User ruling this turn: when a player dies he may throw at the bullseye; if he hits, he can take any territory he wants.

## Decision

Adopt the **Bull Altar** resurrection package:

- **Bull is no longer a territory** — its only job is resurrection. Map becomes the 20 wedge territories across six continents.
- **Dead = 0 territories.** On your turn, throw all 3 darts at bull.
- **Outer bull (25):** resurrect — steal ANY territory on the map; it arrives at 1 HP (fragile, like any fresh conquest).
- **Inner bull (50):** resurrect — steal any territory at FULL 3 HP (the true miracle).
- **Miss:** stay dead, try again next turn. No penalty, just tension.

This **replaces the insurgent rule** locked in the Timed War decision — dead players no longer keep playing on the map.

Also **Siege map (B) is locked as the combat baseline** (Bull Altar requires conquest combat to exist): 3 HP per territory; single/double/treble = 1/2/3 damage (a treble on a full-HP wedge steals outright); hitting your own land reinforces +1 HP (cap 3); fresh conquests reset to 1 HP. Resolves Question 4.

## Why

- **Death becomes a threat vector, not a pity state.** A resurrected player will obviously steal from the leader, so every eliminated player returns as a guided missile aimed at first place — "the bigger your empire, the scarier your graveyard." The leader now defends against the living AND the dead.
- Gives the weakest player the single most dramatic moment available — ideal for the mixed shark+casual table this mode targets.
- Odds: 3 darts at outer bull revives a casual in ~1–2 dead turns, so the graveyard empties instead of snowballing.

## Alternatives considered

- **Insurgents** (standing until now): dead players keep throwing at the map — less drama, no graveyard-aims-at-the-leader pressure.
- **Hard elimination:** dead players sit out; wastes their night, breaks "everyone matters until the end".
- **Flat resurrection (no 25/50 tier):** loses the inner-bull full-HP steal as a distinct miracle moment.

## Consequences / open items

- **Open — Question 5:** darts left in hand after a successful resurrection — A) turn ends (savor the drama) vs B) keep throwing (leftover darts attack as normal). Assistant recommendation: **B**.
- Timed War scoring previously awarded **+2 for the bull** as a standalone capital; with the bull repurposed as the altar that bonus is obsolete — endgame scoring needs a pass when next revisited.
`,

# Cap match rosters at 6 players, enforced client and server

## Context

Matches previously had no player-count limit anywhere — the schema, match engine, and turn rotation are all player-count-generic. The live scorer UI only had room around the center dartboard for a sensible number of side panels, and the user requested a hard cap of 6.

## Decision

Cap match rosters at **6 players (minimum 1)**, enforced at three layers:

- \`src/lib/components/ui/SearchSelect.svelte\` — new \`maxSelected\` prop: selection is blocked at the cap and unselected options are dimmed/disabled
- \`src/routes/match/setup/+page.svelte\` — passes \`maxSelected={6}\`, counter label reads \`(/6)\`
- \`src/routes/api/matches/+server.ts\` — server-side guard rejects match creation with anything other than 1–6 players (client limits are never trusted alone)

## Alternatives considered

- **No cap / higher cap**: layout quality around the center board degrades beyond 6 (3 left + 3 right columns); rejected.
- **Client-only enforcement**: a trust-boundary hole — the API must reject oversized rosters regardless of what the UI allows.

## Consequences

Changing the cap later means touching all three enforcement points (search for \`maxSelected={6}\` and the 1–6 validation in the matches API). Live-scorer layout supports 6 via left/right column split with a compact mode at 3+ players — a cap above ~8 would need a new layout.
`,
  "decisions/cards-around-the-board.md": `---
type: Decision
title: Cards around the board for all roster sizes (condensed panels for 3–6)
description: Decision
tags: [ui, layout, match, playerpanel]
status: accepted
supersedes: "dual-layout-match-view"
timestamp: "2026-09-07T20:26:58.632Z"

# Cards around the board for all roster sizes (condensed panels for 3–6)

## Decision

Every roster size (1–6 players) gets **player cards flanking the board**. For 3–6 players, \`PlayerPanel\` renders in a new **condensed mode** (single compact card: name + active ▶ indicator, undo-delete control with inline confirm, large remaining score — emerald when active, and one bottom row \`S sets · L legs · Avg match-3-dart · Darts this-leg\`). Players are split: first half stacked in the left column, second half in the right, board/input centered (\`col-span-6\`) — e.g. 6 players = 3+3, 3 players = 2+1. The full-width standings strip is removed entirely.

## Context

The dual-layout redesign (superseded) gave 3–6 players a full-width standings strip and cards only to 1–2 players. The user explicitly wanted the card-around-the-board layout preserved for all multi-player matches ("i do want to keep the cards around the board for all 3-6 matches"). Rather than full-size cards (too tall for 3–6 stacked per side), a condensed variant keeps the flanking geometry at any roster size.

## Alternatives considered

- **Keep the standings strip** (previous approach) — rejected by user preference; cards around the board read better and stay consistent across roster sizes.
- **Full-size PlayerPanel cards for 3–6** — too tall when 3 cards must stack per side; condensed mode fits.
- **Hybrid (strip + cards)** — duplicate info, redundant once condensed cards carry S/L/avg/darts.

## Consequences

- One component (\`PlayerPanel\`) covers all layouts via a \`condensed\` flag; the standings strip markup is deleted.
- 1–2 player layouts unchanged (full-size cards, solo mirror intact); mobile order stays players → board.
- Undo-last-turn remains available in condensed cards (inline confirm), not lost with the strip.

# Claim-based territory ownership replaces the damage-flip model in Risk darts

> **DEPRECATED (rolled back)** — the session was rolled back to the original Risk-idea message; this detailed ruling came from the discarded stretch. The baseline still uses plain claim/attack language ("hit neutral land = claim, hit enemy land = attack"), but the cumulative-claims ownership model is NOT standing until re-ratified. See [Risk-territory darts over heat economies](./risk-territory-darts-over-heat-economies.md).

## Context

Brainstorming the Risk-style conquest darts mode (see [Risk Darts (proposed game mode)](../pages/concepts/risk-darts-proposed-game-mode.md)). The prior model was **damage-based**: enemy territories had implicit HP; sufficient damage flipped ownership to the attacker. The user rejected that: "territories (1, 20, 14, etc) are yours when you have the highest claims/scores on that number."

Also locked in the same turn: the **ON FIRE effect = Artillery**, reinterpreted for claims — while hot, every dart adds **+1 to its claim value** (singles claim 2, trebles claim 4). This resolves the ON FIRE open question in the heat decision (see [Heat momentum as the core balancing mechanic](./heat-momentum-core-balancing-mechanic.md)).

## Choice

**Ownership is claim-based, not damage-based.** No HP, no flipping. Every dart adds cumulative claims to the wedge it hits; a territory belongs to whoever holds the **highest cumulative claims** on that number. Tiebreak rule required to make it work: **ties go to the incumbent** — you must strictly out-claim the current owner to take a territory.

## Alternatives considered

- **HP / damage-flip model** — rejected by user. Claim-based wins for three reasons:
  - **Even fewer dead darts** — a dart into the *wrong* wedge is a down-payment on a neighbor, not a miss. Chaos sold as strategy.
  - **The map hardens over time** — fresh numbers cheap to steal, contested numbers money pits, fortified cores stand. The board visibly tells the story of the match.
  - **Natural game clock** — as claims pile up, thefts get expensive, the map stabilizes, endgame arrives on its own.

## Consequences

- Any implementation should track a **per-number, per-player claim ledger** instead of territory HP + owner flags.
- **Forks the claim economy** (open, next question): what is a dart's claim worth? (A) flat — single 1 / double 2 / treble 3, all territories identical; (B) **real dart score** — S14 = 14 claims, T20 = 60, creating rich (15–20 downtown) vs cheap (1–5 countryside) geography and a natural equalizer for casuals; (C) face value, segment ignored. Assistant lean: **B**.
- If B, late-game fortification amplifies (a 200-claim #20 is a castle) → the **win condition needs a clock** (time/round limit or similar), which is the following question.
- Rationale is proposal-stage design, not implemented code.

# Heat momentum as the core balancing mechanic for the Risk-style conquest darts mode

> **SUPERSEDED** by [Risk-territory darts over heat economies](./risk-territory-darts-over-heat-economies.md) — the user rolled the design back past this entire direction ("wrong direction"). Heat economies are out.

## Context

Brainstorming a Risk-style conquest darts game mode (darts = dice, wedges = territories) for mixed-skill groups. The statistical problem: a shark generates ~3x the damage of a casual player (casual ~35% hits aimed wedge / ~2% treble; pub-decent ~60% / ~10%; shark ~85% / ~25%+). Pure conquest means the shark wins every time.

Key insight: **skill is the mean, streaks are the variance. A game that rewards *recent form* instead of *average form* automatically compresses skill gaps** — nobody, shark included, controls *when* they run hot.

## Choice

Make momentum ("Heat") the whole identity of the game:

1. **Every dart is productive** — hit neutral land → claim; enemy land → damage (single 1 / double 2 / treble 3); own land → reinforce (+1 defense). Zero dead throws, so a casual's random dart always does something.
2. **Heat builds on attack/claim darts** — 3 in a row (across turns) → **ON FIRE** next turn, announced via the existing caller soundboard ("HE'S ON FIRE").
3. **Heat is stealable** — hit a player who's ON FIRE → steal their heat / cool them instantly. Hot players paint a target on themselves.

Self-balancing loop: get hot → gain power → become the table's target → get sniped → cool down → someone else catches fire. The shark runs hot more often and gets ganged up on more often — the Risk "leader's empire" dynamic, but mechanical instead of social.

## Alternatives considered

- **Pure conquest** — rejected: shark wins deterministically.
- **Dice-style variance only** — rejected: feels unearned; heat variance has "luck with skill flavor."

## Open question (unresolved at time of writing)

What ON FIRE actually does — originally pitched as three effects:

- **The 4th dart** — one extra dart that turn; simple, darts-native.
- **Artillery** — all darts deal +1 damage that turn (early lean for balance; accelerates game without gambling the heat economy away).
- **All-in assault** — declare a target; land = instant capture, miss = lose ALL heat; maximum drama.

**Updated 2026-09-07: expanded to a 12-option heat/streak bonus toolbox** (user asked for more options), grouped by balance angle:

- **Engine** (reliable, repeatable fun): Artillery (+1 damage); The 4th Dart (one extra throw); **Rapid Fire** — while hot, keep throwing after every productive dart, stop on a dead dart, max 6 (most darts-native, crowd-pleaser); Blitz (trebles instantly capture a territory at any HP).
- **Economy** (heat as stealable currency): **Heat Raid** — darts hitting enemy land while hot steal 1 heat from that territory's owner on top of damage; **Bounty** — going ON FIRE auto-posts a bounty on you: whoever damages you next takes ALL your heat plus a free 4th dart; Tax Man — hitting a hot player's territory pays them 1 heat.
- **Power** (Risk-flavored control): **Dictator** — while hot, YOU choose who throws next; Splash Damage — territories captured while hot deal 1 damage to their board-neighbors; Paradrop — while hot, one dart may target ANY wedge as an instant reinforce-2.
- **Equalizer**: **Kindling** — players with the fewest territories build heat at double rate (strongest anti-runaway lever in the catalog); Ember — streak broken by a *missed* dart keeps half your heat.

Design heuristic that emerged: **prefer bonuses that make the hot player simultaneously more powerful AND more hunted** — self-limiting, because the table snipes them.

Assistant's picks: **Rapid Fire** (core) + **Kindling** (balance backbone) + **Bounty or Dictator** (chaos garnish). Combos awaiting user choice: **A) Party Build** = Rapid Fire + Kindling + Bounty; **B) Strategy Build** = Artillery + Heat Raid + Dictator; **C) Mix** = user's own 2–3 picks.

Also tabled for later tuning: holding a full arc of neighboring numbers ("kingdom") = +1 dart per turn, Risk continent style — powerful but makes you the biggest empire.

**Updated 2026-09-07T20:48:39.497Z — kingdom rule ruled by user (still proposal-stage):** territories are **sub-segments, not whole wedges**. Each number splits into 4 claimable areas in a vertical stack: single under (inner), treble, single above (outer), double. Hold **3 neighbouring areas all yours** → **+1 extra dart every turn** (not once). The game **starts at the 1 wedge**. This supersedes the "full arc of numbers" framing — kingdoms are built *within* a number first; multi-wedge continents may layer on later.

## Consequences

- Any future conquest-mode implementation (scoring, heat tracking, soundboard triggers) should follow this model.
- Awaiting user decision on the bonus combo (A Party / B Strategy / C Mix) before the ON FIRE effect set is locked in.

**Updated 2026-09-07T20:50:30.157Z — ON FIRE ruled by user: Artillery, and only Artillery** (no combo). Now claim-flavored: while hot, every dart adds +1 to its claim value (singles claim 2, trebles claim 4). The damage framing throughout this decision is superseded by claim-based ownership — see [Claim-based territory ownership replaces the damage-flip model](./claim-based-territory-ownership.md).

# Last Stand amendment: blank-first resurrection, next-player robbery, defender bull save

## Context

The [Bull Altar decision](../pages/concepts/risk-darts-proposed-game-mode.md) ruled that a dead player hitting the bull may steal **ANY** territory. User correction this turn — resurrection is not a free pick, it's a duel with seating-order politics. Exact ruling: "the one who died throwing the bulls eye can choose a territory that's blank first, and otherwise can take one from the player who is next, but when that player also throws the bulls eye then he gets to keep the territory and the one who died starts over throwing the bulls eye."

## Decision (user-ruled)

Amends the Bull Altar theft clause; everything else in that decision (bull = altar only, dead = 0 territories, 3 darts at bull, miss = stay dead) stands:

1. **Blank-first:** bull hit + blank territories exist → the dead player MUST claim a blank. Which blank is their free choice (complete a continent, or block the leader).
2. **No blanks left** → may only steal from the **NEXT player in turn order** — not any player.
3. **Defender save:** the robbed player defends on the bull; if they also hit bullseye, the theft is **DENIED**, the dead player stays dead and restarts the bull hunt.

Assistant sharpenings proposed in the same turn (vetoable — NOT yet ruled):

- **Any bull counts** for attacker and defender (this would drop the Bull Altar's 25/50 tier).
- Defender's save is **one dart, thrown immediately** — the standoff happens on the spot, not next turn.
- Successful theft: territory arrives at 1 HP, and remaining darts keep attacking (= Question 5's option B).
- Skip dead players when finding "the next" victim; attacker picks which of the defender's territories.

## Why

- **Seating order becomes graveyard politics.** The resurrection target is fixed — whoever throws after you. Die twice and your neighbor is in a blood feud.
- **Natural escalation arc:** early deaths are cheap land-grabs on an open map; late deaths (blank map) are two-player standoffs at the bull with the whole room watching.
- Closes the "guided missile at first place" exploit of steal-ANY — the dead are scoped to empty land or their neighbor, not a free snipe at the leader.

## Consequences / open items

- **Known design smell, accepted for v1:** whoever sits after the weakest player gets farmed by repeated deaths. Games are short (~21 darts), so live with it; if it stings, the lazy fix is re-seating between games, not a new rule.
- **Tier question pending:** "any bull counts" (proposed) would supersede the 25/50 tiering in the Bull Altar decision.
- **Question 6 now open — map start:** A) cold start (all 20 blank, round-one land rush); B) founding dart (assistant lean: each player throws ONE dart pre-war, landing spot = homeland at full HP, taken land → re-throw); C) snake draft (pick homelands in turn order, last picker throws first).

# Risk-territory darts over heat economies

## Context

A second darts game concept was being brainstormed (crowd: mixed — one shark, casuals; everyone must matter till the end). Two candidate directions were on the table:

1. **Heat economies + claim-scoring** — economic/accumulation mechanics layered on the board.
2. **Risk-style territory control** — the board **is** the map.

During the session the conversation diverged down the heat-economies path. The user called it the wrong direction and asked to roll back to the message where the Risk idea was invented and continue from there.

## Choice

**Risk-style territory control is the core design.** Heat economies and claim-scored mechanics are abandoned — do not reintroduce them.

The Risk baseline:
- Wedges are **territories**, darts are the dice, trebles are artillery
- Hitting neutral land = claiming it; hitting enemy land = attacking it
- Board-neighbor arcs (20-1-18-4, 13-6-10-15, …) form natural **continents**
- The leader gets ganged up on — balancing is **social, not mechanical**

## Alternatives considered

- **Heat economies / claim-scored** (rejected): user judged it the wrong direction for the crowd + soul of the game ("Risk" — board as map).
- **Mechanical catch-up balancing** (rejected in favor of social ganging-up): simpler, fits the drunken-social setting, no rules overhead.

## Consequences

- All downstream design questions (game end, death, resurrection, round structure) build on the territory baseline, not on economy scoring.
- Open at time of decision: **Question 3 — how does the game end / how final is death?** (candidates: A total conquest, B domination win, C death with resurrection, D countdown endgame).
- Design lives in conversation, not code yet — when implementation starts, this decision is the reference point for the game mode's shape.

# Shanghai feat grants +1 dart the next turn

## Context

The earliest Risk Darts brainstorms wanted a **momentum reward** — the discarded ON FIRE / heat-economy mechanic tried to buy it with twelve lines of rules. User ruling this turn distills that same instinct into a named darts feat with one line of rules: "if you throw a shanghai on any box you'll get an additional throw the next turn."

## Decision (user-ruled)

**Classic Shanghai** — single, double, AND treble of the same wedge, within one turn, in any order — earns **+1 dart the following turn**. The app detects it automatically and the caller plays a **"SHANGHAI!"** clip (loudest sound of the night).

Falling out for free:

- **Shanghai on enemy land = guaranteed capture.** 1+2+3 = 6 damage vs 3 HP max; the leftover damage over-reinforces the grip — the stylish route is also the devastating one.
- **Shanghai on your own land still counts.** Damage/reinforcement is capped at 3 HP, but the feat is the feat — the extra dart is earned on pure form.
- **No caps, no anti-stacking rules.** Shanghai is roughly a 1-in-100-turns event even when hunting it deliberately — rarity IS the balancing mechanism.

Assistant-assumed defaults (vetoable, not yet user-ruled — fold into the Question 7 read-back):

- Any order within the turn qualifies.
- Works in both 301-clock and Domination modes.
- Dead players throwing at the Bull Altar cannot Shanghai — the bull has no treble.

## Why

- Rewards skill with more skill opportunities instead of handicaps — consistent with the mode's "social, not mechanical" balancing stance.
- One named feat replaces a whole heat economy: the momentum-reward payoff without bookkeeping.
- Guaranteed-capture synergy means the highlight-reel throw is also the strategic throw.

## Consequences / open items

- Caller audio: needs a "SHANGHAI!" event clip (fits the existing ElevenLabs soundboard pattern in \`static/audio/\`).
- Detection: match/territory engine must check single+double+treble of one wedge across a turn's darts. Edge to rule in the veto pass: on a 4-dart turn (earned by a previous Shanghai), does any 3-dart subset count, or strictly the turn's darts as thrown?
- Question 7 remains open: final veto pass over the full read-back + naming the game (Conquest / 20 Kingdoms / Trebles & Territories / Gold Coast).

# Timed War default endgame, fixed continents, no elimination for Risk darts

## Context

Resolves the standing open **Question 3** ("how does the game end, and how final is death?") on the [Risk Darts proposed game mode](../pages/concepts/risk-darts-proposed-game-mode.md) concept page. Options were A) total conquest, B) domination win, C) death with resurrection, D) countdown endgame. Design-stage ruling from a brainstorm; no code yet.

## Choice (locked with user)

1. **Timed War is the default mode (option D)** — fixed dart budget per player, default 21 (tunable). End scoring: **1 pt per territory, +2 per full continent, +2 for the bull** (standalone capital, belongs to no continent). Full ranking 1st/2nd/3rd for league-night tables. Tiebreak: one sudden-death dart each, nearest bull.
2. **Fixed, colored continents** — groupings never change game to game (user-seeded examples: 12-20-18, 16-11-9); the rest drafted so each continent has roughly one premium, one mid, one cheap number for comparable pull. Learnable map, meta develops over weeks. UI renders the board in continent colors.
3. **No elimination in Timed War — insurgents** — a player who loses all land becomes an *insurgent*: still throwing, may attack anyone, and any neutral wedge hit becomes their new homeland. Solves the mixed-crowd "everyone alive till the end" requirement structurally, not with a bolt-on resurrection rule.
4. **Domination (option B) is a selectable alt mode** for sprint nights.

## Alternatives considered

- **Total conquest (A) as default** — rejected: too long for league nights; elimination breaks the mixed crowd.
- **Death + resurrection (C)** — superseded by the structural insurgent rule.
- **Rotating/player-chosen continents** — rejected in favor of fixed balanced groupings (learnability, comparable continent pull).

## Consequences

- Timed endgame is self-dramatizing: everyone can count remaining darts; the final round is a coordinated raid on the leader.
- Re-ratifies the "continent bonus" idea from the rolled-back discard pile (fixed continents + holding bonus); the rest of that stretch stays discarded.
- **New open question — Question 4: how hard is it to steal a territory?** A) *glass* (any dart in the wedge takes it instantly); B) *siege* (assistant lean): 3 HP per territory, single/double/treble = 1/2/3 damage, a treble steals outright, hitting your own land reinforces +1 HP (cap 3), freshly captured land resets to 1 HP; C) *fortress*: 3 HP but conquests reset to 3 (defender-favored, calmer). Note: siege/fortress reintroduce territory **HP**, which the deprecated rolled-back ruling had replaced with cumulative claims — that rejection is not standing, so HP is back on the table pending user answer.
- Rationale is design-stage; nothing implemented.

# Treble-frontier founding: blank territories require a treble to claim

## Context

Resolves standing **Question 6** ("how does the map start?") on the [Risk Darts proposed game mode](../pages/concepts/risk-darts-proposed-game-mode.md) concept page. The standing baseline said "hitting neutral land = claiming it"; Question 6 offered cold start, founding dart, or snake draft. User ruling this turn: **the first claim on a territory always needs to be a treble — otherwise it's nobody's.**

## Decision

- A blank wedge can only be **founded by a treble**; treble-founded land arrives at full 3 HP.
- Singles and doubles into blank wedges are **dead darts** — strict reading, shipped strict.
- Exception: the **Bull Altar** resurrection still claims a blank at 1 HP without a treble — the altar stays the landless player's back door.
- Replaces the "neutral land = claiming it" baseline clause and rules out Question 6's founding-dart and snake-draft options.

## Rationale

- The opening becomes a **treble rush** — the map gets civilized slowly and violently; frontier tension.
- Asymmetric difficulty creates a **role split with one rule**: founding needs a treble (~2–25% by skill) but robbing owned land needs only singles (3 HP, 1/2/3 damage) → skilled players become settlers building empires, casuals become raiders looting them. Solves the mixed-crowd problem without handicap mechanics.
- Effort = grip: treble-founded 3 HP, stolen/bull-claimed 1 HP — consistent and intuitive.

## Alternatives considered

- **Free claims on any hit (cold start)** — rejected: no frontier, no role split.
- **Founding dart / snake draft pre-war** — ruled out by the user's treble rule.

## Consequences

- Early-game singles into blank wedges are wasted darts. Flag for playtesting: revisit only if casuals feel useless early — strictness is what makes the frontier feel like a frontier.
- Combat vs owned land (siege map B) is unchanged; only blank-land founding changed.

# Glossary

| Term | Definition |
|------|------------|
| 301/501/701/1001 | Standard darts game variants named by their starting score; players race from that score down to exactly zero. 501 is the default competitive format. |
| Leg | One race from the starting score to zero. A match is won by taking a majority of legs (or of sets containing legs). |
| Set | A group of legs; winning a set requires winning a majority of its legs. Matches can be configured as best-of-N sets × best-of-N legs. |
| Turn (visit) | One player's throw of up to 3 darts at the board; recorded as a \`TurnRecord\` with three \`DartData\` entries. |
| Bust | Scoring more than the remaining score, reaching exactly 1, or reaching 0 without a required double — the turn is voided and the score resets to its pre-turn value. |
| Double-in / Double-out | Rule variants requiring the first (double-in) or final (double-out) scoring dart to land in a double ring (or inner bull) for it to count. |
| Checkout | The sequence of darts that finishes a leg from the current remaining score. Highest possible 3-dart checkout is 170. |
| Checkout suggestion | Optimal finishing combination (e.g. "T20, T20, D25" for 170) computed by \`src/lib/game/checkout-suggestions.ts\` when a player is on a finish. |
| Treble 20 / Ton 80 | Three treble-20s in one turn = 180, the maximum single-turn score; also called a "ton 80". Announced by the caller with a special clip. |
| Bull / Bullseye | Outer bull = 25 points; inner bull (double bull) = 50 points and counts as a double. |
| Caller | The audible referee voice that announces scores, busts, "game on", leg/set/match winners, etc. Implemented in \`src/lib/utils/darts-caller.ts\`. |
| Soundboard | Pre-generated MP3 clips in \`static/audio/\` — one per score (0–180) and per event, in multiple voices (default, Scotty, voice 3). Generated by \`scripts/generate-soundboard.ts\` via ElevenLabs. |

| Three-dart average | Career/leg statistic: average points scored per turn (3 darts). The standard measure of player strength. |
| Last-20-legs stats | Rolling statistics window over the player's 20 most recent legs, shown alongside all-time stats during and after matches. |
| MatchConfig | Config object for a match: starting score, legs per set, sets per match, double-in flag. |
| MatchState / LegState | Runtime state objects managed by \`match-engine.ts\`: remaining scores, legs/sets won, current thrower, current leg turns. |
| Thrower rotation | Rule (verified PDC/WDF-compliant): the player who did not start the previous leg starts the next one; same alternation applies to sets. |

# darts_email localStorage key stores the email raw, not JSON

The \`darts_email\` localStorage key stores the email as a **raw string** — \`getEmail\`/\`setEmail\` do not JSON-encode it. This differs from the accounts key, which IS stored as JSON. Seeding \`localStorage.setItem('darts_email', JSON.stringify(email))\` (with quotes) silently breaks account-scoped API fetches: the server receives a quoted email, matches no rows, and returns an empty player list with no error.

When seeding test/dev localStorage, set \`darts_email\` raw: \`localStorage.setItem('darts_email', email)\`. Encoded in \`e2e/helpers.ts\` comments.

Discovered while wiring the Playwright E2E suite — the match-ui tests failed against a working API purely because of this quoting mismatch.

# GoDaddy apex domain on Railway: A record to live edge IP, not the documented one

## The pattern (snooze.monster / dart.monster, Sep 2026)

Railway's docs say GoDaddy apex is unsupported (no CNAME flattening) and recommend a static A record to \`66.33.22.9\`. That IP is a **stale edge** — pointing the apex there wedges cert issuance forever at \`CERTIFICATE_STATUS_TYPE_ISSUING / POLLING_AUTHORIZATIONS\` (retry is unavailable because it never "fails").

## Working setup for a GoDaddy apex on Railway

1. \`railway link\` the project, \`railway domain <apex>\` to attach it
2. Read the per-domain code from the domain status (e.g. \`ebx3mx8g.up.railway.app\`) and **resolve it**: that IP (currently \`69.46.46.x\` block) is the live edge
3. GoDaddy API: \`PUT /v1/domains/{domain}/records/A/@\` → that IP (GoDaddy rejects apex CNAME — \`INVALID_RECORDS\`, name "[ ]")
4. \`PUT .../records/TXT/_railway-verify\` with the \`railway-verify=...\` value
5. If the cert stays stuck: \`railway domain delete <id> --yes\` + \`railway domain <apex>\` to re-add — fresh issuance completes in seconds. A fresh code/IP is generated; re-resolve and update the A record.

Railway's edge routes by SNI/Host, so any live edge IP in the block serves the domain. Certs issue with A records just fine (snooze.monster has run this way since Aug 2026).

Files/CLIs involved: \`railway\` CLI (logged in), GoDaddy API keys in \`.env\` (\`GODADDY_KEY\`/\`GODADDY_SECRET\`, auth header \`sso-key KEY:SECRET\`).
`,

# GoDaddy DNS can't serve a Railway apex domain

## The gotcha

Railway's TLS cert flow for an apex domain **requires the root to be a CNAME (flattened/ALIAS)** pointing at the service's \`<hash>.up.railway.app\` target. A static A record pointing at Railway's edge IP (\`66.33.22.9\`) passes the \`_railway-verify\` TXT ownership check but the cert **stalls at ISSUING forever** — issuance only completes against the CNAME.

**GoDaddy DNS does not support CNAME flattening / ALIAS records at the root** — their API rejects apex CNAMEs, and Railway's docs explicitly list GoDaddy as unsupported for apex domains. Verified empirically on 2026-09-07 while wiring \`dart.monster\`.

## What works / what doesn't

- ✅ \`www\` subdomain → CNAME to \`<hash>.up.railway.app\` → cert issues fine (www.dart.monster serves the Railway service)
- ✅ Apex A record \`66.33.22.9\` + \`_railway-verify\` TXT → domain verifies as attached
- ❌ Apex cert issuance without flattening — stalls at ISSUING

## Known workarounds

1. **Lazy (recommended when staying on GoDaddy):** GoDaddy dashboard → DNS → Forwarding → 301 permanent forward apex → \`https://www.dart.monster\`. GoDaddy serves HTTPS on forwards. Not API-exposed (one manual click).
2. **Railway's official workaround:** move DNS to Cloudflare (free), keep registration at GoDaddy, replicate records (watch the MX/SPF/DKIM email records), flip nameservers via API. Full apex on Railway with its own cert.
3. **Copy the user's existing pattern:** the user's ~100 other domains (changelog, backlog, strava…) all serve apexes from **Vercel** (A record \`3.33.130.190\`). A Vercel redirect project for the apex achieves the same result.

## Related

- [[dart-monster-dns-setup]] — the concrete DNS/domain state this was discovered against

# Miss turns must persist with dartsThrown ≥ 1

# Refresh-resume depends on chronological turn order and persisted firstThrowerId

Refreshing the browser mid-leg (resume logic in \`src/routes/match/[id]/+page.svelte\`) silently depends on two implicit contracts. Breaking either reproduces the "wrong thrower after refresh" bug (fixed 2026-09):

1. **\`getTurnsForLegs\` (\`src/lib/db/database-service.ts\`) must return turns in chronological order (\`createdAt ASC\`).** The resume logic reads \`turns[turns.length - 1]\` as "the latest turn" to derive the next thrower. It previously ordered \`DESC\`, so \`[len-1]\` was the *oldest* turn — the thrower was only right by luck of turn parity. Note the split: \`getLegTurns\` (the \`?legId=\` history endpoint) orders \`turnNumber ASC\` and the history page is unaffected either way — don't "fix" one to match the other.

2. **Leg-start alternation must be reconstructed from the leg's persisted \`firstThrowerId\`, not from the current thrower.** Resume used to set \`firstThrowerIndex: currentPlayerIndex\` (the *next* thrower), so after refresh + checkout the client picked the next leg's starter from the wrong index while the DB persisted the correctly-alternated one — the following refresh showed a different thrower than the screen had.

If turns ever come back newest-first again (or a new consumer assumes DESC), refresh-resume breaks with no error — just a wrong thrower. When touching turn ordering or resume, verify the thrower after a mid-leg refresh.

# SSR pages are empty shells — EmailGate gates all rendering client-side

## Gotcha

Every route renders an **empty SSR shell** — \`curl\`ing a page (or reading its SSR HTML) shows no content for ANY route. The app gates rendering behind the client-side \`EmailGate.svelte\`, so nothing renders until the account/localStorage key is set in a real browser.

## Consequence for verification

- \`curl localhost:5173/...\` returning 200 with an empty body is **normal**, not a bug — it proves nothing about the page.
- To actually verify a page: headless browser with the account localStorage key set, screenshot, then inspect via the image-analysis skill (direct image viewing isn't available).
- Query params (e.g. \`?tab=fun\`) are read in \`onMount\`, so SSR snapshots won't reflect them either.

## Also worth knowing

\`svelte-check\` has 4 baseline errors in \`Dartboard.svelte\` that predate current work — "clean for touched files" is the real bar, not repo-wide zero.

# structuredClone can't clone Svelte 5 $state proxies — pass $state.snapshot() at the engine boundary

## Gotcha

Passing a Svelte 5 \`$state\` proxy to pure engine code that internally does
\`structuredClone(state)\` throws — \`structuredClone\` cannot clone the reactive
proxy. Symptom: engine calls silently fail / throw with darts never registering
(discovered wiring \`/match/conquest\` to \`conquest-engine.ts\`: clicks emitted,
engine state never changed).

## Fix

Snapshot at the UI→engine boundary:

\`\`\`ts
const next = applyDart($state.snapshot(game), segment, multiplier);
\`\`\`

\`$state.snapshot()\` returns a deep plain clone the engine can freely clone/own.

## Related Svelte 5 footguns hit in the same session

- A local variable named \`state\` collides with the \`$state\` rune — rename (e.g. \`game\`).
- \`$state<T>()\` generic call syntax is not valid — annotate the initializer instead.

## Source

- \`src/routes/match/conquest\` wiring fix; engine at \`src/lib/game/conquest-engine.ts\`

# Tooltips must use fixed positioning to escape overflow clipping

## Gotcha

\`position: absolute\` tooltips get clipped by any ancestor with \`overflow: hidden|auto|scroll\`. This app has many such ancestors — stats tables wrapped in \`overflow-x-auto\` scroll containers, bezel containers — so absolutely-positioned bubbles were cut off at the wrapper edge.

## Fix pattern (applied 2026-09-07)

The shared \`Tooltip\` component (\`src/lib/components/ui/Tooltip.svelte\`) now uses a \`position: fixed\` bubble:

- Fixed positioning is relative to the viewport, which **escapes every clipping ancestor** — no \`overflow\` rule on any parent can clip it.
- The bubble renders off-screen (\`top/left: -9999px\`) first, then an \`$effect\` measures both trigger and bubble via \`getBoundingClientRect()\` and sets viewport coordinates. Measuring the bubble itself is required because its width varies with content (whitespace-nowrap text).
- Supports all four positions (top/bottom/left/right) with an 8px gap.

## Rule for future floating UI

Any new floating element (dropdown, popover, menu) rendered inside a scroll container must use this same fixed + measured pattern — or a portal — not \`position: absolute\`. Otherwise it will clip the moment it lands in a scrollable wrapper.
`,

# TS can't narrow $state inside closures — use $derived.by with local capture

## Gotcha

When iterating/branching over a \`$state\` value (e.g. a \`$state\` array of players) inside a callback or closure, TypeScript cannot narrow it — the proxy type stays broad and \`svelte-check\` errors on property access (e.g. narrowing a union by an \`if\` inside \`.map()\` or an event handler).

## Fix / convention

Move the logic into a \`$derived.by(() => { ... })\` block and capture the \`$state\` value into a plain local \`const\` first. The local const is a snapshot TypeScript can narrow normally, and \`$derived.by\` keeps it reactive.

\`\`\`svelte
const rotation = $derived.by(() => {
  const players = $state.players; // local capture — narrowable
  // ... if/property access narrows fine here
});
\`\`\`

Seen in the live scorer when computing the throw rotation (\`leftPlayers\`/\`rightPlayers\`) for the 3+ player layout.

## Applies to

# Overview

**dart.monster** (deployed as **darts.xyz**) is a precision darts scoring web app built for players who want accurate scoring and deep statistics. Multiple players compete in classic 301/501/701/1001 matches organized into configurable legs and sets, with double-in/double-out rules, live checkout suggestions, and an audible "caller" that announces every score like a championship referee. The stack is **SvelteKit 2 + Svelte 5 (runes) + TypeScript + Tailwind CSS v4** on the frontend, persisted to **PostgreSQL** (hosted on Railway) through **Drizzle ORM** — all tables live in a dedicated \`darts\` schema. The production build targets Node via \`@sveltejs/adapter-node\`.

The application code lives in \`src/\`. Game rules are pure TypeScript modules in \`src/lib/game/\` (\`scoring.ts\` for dart math and bust/checkout detection, \`match-engine.ts\` for the leg/set state machine and thrower rotation, \`checkout-suggestions.ts\` for optimal finishes ≤170, \`stats-engine.ts\` for averages/checkout %/180s). The data layer is \`src/lib/db/\` (Drizzle schema + a \`database-service.ts\` service layer) exposed through a REST API under \`src/routes/api/\` (players, matches, legs, turns, stats, insights, settings). Pages cover match setup, a live scorer with an interactive SVG dartboard (\`Dartboard.svelte\`), match history, player profiles with all-time and last-20-legs stats, and a soft-delete archive with restore. Audio is a pre-generated ElevenLabs soundboard (\`static/audio/\`, per-voice score/event clips) plus Kokoro TTS running in-browser for dynamic player names.

Around the app itself sits a full AI-assisted development workspace: \`.opencode/\` holds a large skill library (autoresearch, te9-spec, tdd-workflow, svelte5-best-practices, pocketbase/railway docs, design-taste skills) used to research, spec, and build the app; \`.specs/darts-501-app/\` contains the resulting specification and task breakdown; \`.codebase-graph/\` and \`.llm-docs/\` hold generated codebase knowledge graphs and LLM-oriented docs. \`docs/\` keeps darts-rules research (PDC/WDF turn-taking), E2E gameplay simulations, test results, and a player-metrics tree. Supporting tooling includes \`scripts/generate-soundboard.ts\` (regenerates the caller MP3s), \`drizzle/\` SQL migrations, and a vendored copy of \`godaddy-cli\` (a Go CLI for domain/DNS management, with a prebuilt \`godaddy.exe\`).

# Risk Darts (proposed game mode)

## What is it?

A proposed (brainstorm-stage, no code) game mode that adapts Risk-style territory conquest to the dartboard: **the board IS the map** — wedges are territories, darts are the dice, trebles are artillery. Final name **Trebles and Territories** (resolved from working title "Conquest" — see Question 7). Designed for a mixed crowd (one shark + casuals) where **everyone must matter until the end**.

## Standing baseline

- **Treble-frontier founding** — a blank wedge can only be founded by a **treble** (founds at full 3 HP); singles/doubles into blank land are dead darts, strict. Exception: Bull Altar resurrection claims a blank at 1 HP without a treble. Creates the settler (treble-skilled) vs raider (casual) role split. (See [Treble-frontier founding decision](../../decisions/treble-frontier-founding-requires-treble.md).)
- **Combat: Siege map (B) — LOCKED.** 3 HP per territory; single/double/treble = 1/2/3 damage vs enemy land, capture at 0 → yours at 1 HP; hitting your own land reinforces +1 HP (cap 3).
- **Fixed, colored continents** — six continents over the 20 wedges, concrete groupings: **{20,18,12}, {16,11,9}, {19,13,5}, {17,6,2}, {15,10,8,7}, {14,4,3,1}**. The last is a four-wedge "slums" continent of low-aim numbers — cheap to complete while others fight over the Gold Coast (emergent strategy). Board renders in continent colors for instant map readability — palette locked to the [Coolors 10-color band decision](../../decisions/trebles-territories-board-palette-coolors.md) (Gold Coast \`#FFB703\`, Highgate \`#8ECAE6\`, Iron Ridge \`#BB3E03\`, The Pass \`#219EBC\`, Mercia \`#126782\`, Fourlands \`#3A6787\`).
- **Bull is NOT a territory** — it is the **Bull Altar**, resurrection-only (see [Bull Altar decision](../../decisions/bull-altar-resurrection-replaces-siege-lock.md)).
- **Death & resurrection (Bull Altar + Last Stand amendment):** dead = 0 territories; on your turn throw all 3 darts at bull. Bull hit = resurrect, but **blank territories first** (claim any empty wedge, your choice); no blanks → steal one territory from the **next player in turn order only**. The robbed player gets a **bull save**: if they also hit bullseye the theft is DENIED and the dead player stays dead (restarts the bull hunt). Miss = stay dead, retry next turn. Remaining darts keep attacking after a resurrection. See [Last Stand amendment](../../decisions/last-stand-amendment-blank-first-resurrection.md).
- **Timed War is the default end mode** — clock measured in **turns per player** (equal throws), branded **170** (sprint, ~14 turns), **301** (default, ~25 turns), **501** (marathon). Score at the end: 1 pt/territory, +2 per full continent. Full 1st/2nd/3rd ranking for league tables; tiebreak = one sudden-death dart each, nearest bull. (The former +2 bull-as-capital bonus is obsolete now that the bull is the altar — needs a scoring pass. See [turns-clock decision](../../decisions/timed-war-clock-in-turns-per-player.md).)
- **Domination** is a selectable alt mode for sprint nights — **hold 7 territories or any full continent = instant win**.
- **Shanghai bonus** — single + double + treble of the same wedge in one turn (any order) = **+1 dart next turn**. Auto-detected by the app, with a "SHANGHAI!" caller clip. On enemy land it's a guaranteed capture (1+2+3 = 6 damage vs 3 HP, overkill reinforces); on your own land the feat still counts even though reinforcement is capped. Works in both 301-clock and Domination; dead players on the Bull Altar can't Shanghai (bull has no treble). Too rare (~1-in-100 turns) to need caps. (See [Shanghai bonus decision](../../decisions/shanghai-feat-grants-1-dart-the-next-turn.md).)
- Balancing is **social, not mechanical** — the leader gets ganged up on; the graveyard of dead players aims at empty land or the neighbor, turning seating order into politics.

## Open questions

### Question 6: how does the map start? — RESOLVED

Treble-frontier founding (see baseline): all 20 wedges start blank; only a treble founds. Rules out cold-start free claims, the founding dart, and snake draft.

### Question 7 (live): veto pass + naming

- One veto pass over the full read-back (treble-frontier consequences, turns-clock 170/301/501 mappings, concrete continent groupings, domination trigger).
- **Name the game — RESOLVED:** **Trebles and Territories** (chosen in the spec turn). The [implementation spec](../artifacts/trebles-territories-implementation-spec.md) The [implementation spec](../artifacts/trebles-territories-implementation-spec.md) then fixed the preset ladder (201→5001 band, since [re-banded to 51–1501 in steps of 50](../../decisions/preset-ladder-51-1501-steps-of-50.md), **301 the default**), each preset labeled with estimated play duration, plus the [LLM commentary](../entities/llm-commentary-trebles-territories.md) tab.

### Pending sharpenings from the Last Stand turn (vetoable, not yet ruled)

- Any bull counts for attacker and defender (would drop the Bull Altar 25/50 tier: 25 = steal at 1 HP, 50 = steal at full 3 HP).
- Defender's save is one dart, thrown immediately (standoff on the spot, not next turn).
- Skip dead players when finding "the next" victim; attacker picks which of the defender's territories.

## Discard pile (rolled back — re-proposable, NOT standing)

- **Insurgents:** lose all land → keep throwing, attack anyone, any neutral wedge hit becomes your new homeland. Replaced by the Bull Altar resurrection mechanic.
- **Steal ANY territory on a bull hit:** the original Bull Altar theft clause — replaced by the Last Stand amendment (blank-first, next-player-only, defender bull save).
- **Claim-based ownership detail:** territory belongs to highest *cumulative claims* on a wedge, ties to incumbent (see deprecated [claim-based ownership decision](../../decisions/claim-based-territory-ownership.md)).
- **ON FIRE = artillery:** while hot, darts add +1 claim value (see superseded [heat momentum decision](../../decisions/heat-momentum-core-balancing-mechanic.md)).
- **Sub-segment granularity:** each wedge = 4 claimable sub-areas; 3 neighbouring sub-areas of one number = **kingdom** → +1 dart per turn.
- **Start at the 1 wedge.**
- **Claim valuation options:** flat (S1/D2/T3) vs real dart score vs face value. (The fixed premium/mid/cheap continent balancing now covers this role instead.)

## Why does it matter?

It targets the mixed-skill-table problem without artificial handicap mechanics: the table gangs up on the leader (balancing IS social), every throw matters (a casual's sloppy dart still chips an enemy or saves at the altar), the timed budget guarantees the ending is always a tense raid — and the treble-frontier rule splits the table into settlers and raiders from the first throw. Death is a duel at the bull aimed at empty land or your neighbor, not a pity exit.

## Relationships

- [Treble-frontier founding: blank territories require a treble to claim](../../decisions/treble-frontier-founding-requires-treble.md) — resolves Question 6; blank land only founded by trebles (settler/raider split)
- [Timed War clock measured in turns per player, branded 170/301/501](../../decisions/timed-war-clock-in-turns-per-player.md) — amends the Timed War budget: equal turns per player, 301 default
- [Bull Altar resurrection replaces insurgents; Siege map B locked](../../decisions/bull-altar-resurrection-replaces-siege-lock.md) — locks combat model and the death/resurrection loop (resolves Question 4, supersedes the insurgent rule)
- [Last Stand amendment: blank-first resurrection, next-player robbery, defender bull save](../../decisions/last-stand-amendment-blank-first-resurrection.md) — amends the Bull Altar theft clause: blanks first, next-player-only robbery, defender bull save denies
- [Shanghai feat grants +1 dart the next turn](../../decisions/shanghai-feat-grants-1-dart-the-next-turn.md) — the momentum reward, distilled into a named feat: S+D+T of one wedge in a turn buys an extra dart next turn
- [Timed War default endgame, fixed continents, no elimination](../../decisions/timed-war-default-endgame-fixed-continents.md) — locks the end mode and continents (its insurgent clause is superseded by the Bull Altar decision; its default-21 budget clause is amended by the turns-clock decision)
- [Risk-territory darts over heat economies](../../decisions/risk-territory-darts-over-heat-economies.md) — the rollback anchor decision
- Would reuse the scoring/event core of the existing 501 match engine (\`src/lib/game/match-engine.ts\`) and the interactive \`Dartboard.svelte\`, but with wedge-based territory state instead of leg/set scoring.

## Source

- Design brainstorm from a product discussion (no source file yet); founding locked in the Treble-frontier decision, clock amended by the turns-clock decision, combat and death rulings in the Bull Altar decision, theft rules amended by the Last Stand decision, momentum via the Shanghai bonus decision.

# Match Stats Tab

## What is it?

The **Stats tab** in the live match UI (\`/match/[id]\`), displayed as a sibling tab to **Turns**. It shows a full statistics table for **all players** in the match simultaneously — replacing an earlier "coming soon" placeholder.

## Why it matters?

During a live match, players previously had to wait until a match ended (or visit player profile pages) to compare detailed stats. The Stats tab surfaces every player's performance side by side while the match is still in progress, enabling in-match comparisons and form tracking.

## Details

- **Location**: \`src/routes/match/[id]/+page.svelte\` (Stats tab panel + tab switcher)
- **Table columns**: rank number, Darts, 3-Dart Avg, Checkout %, Double conversion, 60+/100+/140+/180 counts, <20 counts, 60+ finishes, Last-3-vs-Prior trend
- **Layout**: horizontally scrollable on narrow screens
- **Data source**: computed from the in-memory match state's turns; three-dart averages and other metrics follow \`src/lib/game/stats-engine.ts\` conventions

### Related average displays shipped together

- **Stats card**: always shows a \`Match Avg\` row; a \`Leg Avg\` row appears once a leg has finished (\`set > 1 || leg > 1\`) — hidden during leg 1 because the two are identical there. A 60+/100+/140+/180 grid sits below.

# All code/logic todos must use the TDD skill (red→green→refactor)

## The rule

Any todo whose deliverable is **code or logic** must be implemented using the TDD skill at \`E:\\skills.te9.dev\\matt-pocock\\skills\\engineering\\tdd\\SKILL.md\` (the mattpocock tdd skill), with its core process baked into the todo:

- **Vertical RED→GREEN→REFACTOR** — each cycle covers one behavior end-to-end (test through the public interface → make it pass → refactor), not horizontal slices (all tests, then all impl).
- **One behavior per cycle.**
- **Tests through public interfaces only** — no testing internals/private functions.

## When it applies

Every todo that produces code or logic. In the current 27-todo plan, that's 24 of 27.

## Legitimate exclusions

Todos whose deliverable is not code/logic do NOT carry the requirement:

- **Prompt/eval tuning** (e.g. persona prompt calibration) — prompt iteration + evaluation, not implementation.
- **The test suite itself** (e.g. an E2E full-match simulation todo) — the todo *is* the test; TDD-of-a-test is meaningless.
- **Manual QA/polish passes** — human verification, nothing to test-first.

## Rationale

User mandate (stated 2026-09 session): keeps implementation quality uniform across agents/sessions working the todo list, and prevents the classic failure mode of writing all implementation first and backfilling tests.

## Source

- Todo plan referenced in session: spec → palette → 27 todos → acceptance criteria, M1–M5 milestones.

# Never hardcode player slots in match UI

## Guideline

In any match UI, never hardcode player slots or indices (\`players[0]\`, \`players[1]\`, "P1 panel", "P2 panel"). Always loop over the roster and render per-player components generically.

## When it applies

Any page or component that renders player-specific UI: live scorer panels, stats, turn indicators, checkout hints.

## Rationale / evidence

The match engine (\`src/lib/game/match-engine.ts\`) and thrower rotation are fully player-count-generic. The live scorer at \`src/routes/match/[id]/+page.svelte\` nonetheless hardcoded exactly two side panels (\`players[0]\` left, \`players[1]\` right), so players 3–6 rotated turns correctly but had **no scoreboard at all** — a whole class of bug the engine can't catch. Fixed by extracting [[playerpanel]] and looping left/right columns. Any new player-indexed UI would reintroduce the same invisible-player bug.

## Consequence

Roster can be 1–6 players (see the match player limit decision); UI must render correctly for every size, using condensed [[playerpanel]] cards for 3+ (see the cards-around-the-board decision).

# Use $app/stores $page for page state — house style

## Rule

Page-level state in SvelteKit routes uses **\`$app/stores\` + \`$page\`** (e.g. \`$page.url.searchParams\` for tab state), not \`svelte-navigation\`, context stores, or local state.

## When it applies

Any new route or page-level UI state (tabs, filters, view mode). Before introducing a state pattern, check how sibling routes under \`src/routes/\` do it and copy that — this was how the Fun tab (\`?tab=fun\` on \`/match/setup\`) was built.

## Rationale

Consistency across routes; URL-synced state stays shareable/bookmarkable; one less pattern for future sessions to reverse-engineer.

# Use the Tooltip component, not native title attributes

## Guideline

When a UI element needs a tooltip, use the project's \`Tooltip\` component (\`src/lib/components/ui/Tooltip.svelte\`) — never the native \`title\` attribute. Replace any existing native \`title\` tooltips when touching nearby markup.

## When it applies

Any hover/focus explanatory hint in Svelte components: table headers, stat labels, buttons, icons.

## Rationale

- \`title\` tooltips are invisible on touch devices, delayed ~1s by browsers, and unstyled — unusable on the mobile scorer UI.
- The \`Tooltip\` component gives styled, positioned, accessible (hover + focus) tooltips with a short delay (~100ms) already tuned for the app.
- Applied 2026-09-07: all 13 Stats-tab headers in the match scorer moved from \`title\` attributes to the \`Tooltip\` component, so stat abbreviations (CO%, Dbl, 60+F, Prior) are readable on all devices.

## Evidence

- Stats tab header tooltips in the match scorer UI (turn 2026-09-07).
